name: Discord Commit Feed

on:
  push:
    branches:
      - main

jobs:
  notify:
    if: github.repository == 'Silo-Server/silo-server'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-discord-commits.yml
    with:
      thread_id: ${{ vars.DISCORD_COMMITS_THREAD_ID }}
    secrets:
      webhook_url: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
